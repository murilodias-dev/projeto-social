<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Redes Sociais</title> 
    <style> 
    @charset "UTF-8";

    *{
        margin: 0px;
        padding: 0px;
        font-family: Arial, Helvetica, sans-serif;
    }
    
    html, body{
        height: 100vh;
        width: 100vw;
    } 

        body {
            background-color: white;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("Imagens/fundo-madeira.jpg");
            background-size: cover; 
            background-repeat: no-repeat;
        } 

        main{
            position: relative;
            height: 100vh;
        }

        section#celular{
            position: absolute; 
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background-image: url("Imagens/frame-iphone.png");
            background-size: contain;
            background-repeat: no-repeat; 

            height: 600px;
            width: 300px;
           /* Se o Height aumenta 100+ o Width aumenta +50 */
        }

        section#redes-sociais{
            position: absolute;
            
            height: 400px;
            width: 90px;

            right: 10px;
            top: 10%; 

        } 

        a > img:hover{
            transform: scale(1.1);
            transition: 0.3s;
        }

        a > img{ 
            border-radius: 50%;
            height: 90px; 
            width: 90px; 

            background: center no-repeat;
            background-size: 100px;
            
            margin-top: 20px;
        } 

        iframe#tela{
           position: relative; 
           top: 50%;
           left: 50%; 
           transform: translate(-50%, -50%);


           width: 258px;
           height: 454px;
        }
    </style>
</head>
<body> 
    <main>
    <section id="celular">
        <iframe src="home.html" name="tela" id="tela" frameborder="0"></iframe>
    </section>

    <section id="redes-sociais"> 
        
    
        <a class="redes" href="home.html" target="tela"> <img src="Imagens/logo-home.jpg" alt=""></a> 



        <a class="redes" href="youtube.html" target="tela"> <img src="Imagens/logo-youtube.jpg" alt=""></a>
    


        <a class="redes" href="github.html" target="tela"> <img src="Imagens/logo-github.jpg" alt=""></a>



        <a class="redes" href="facebook.html" target="tela"> <img src="Imagens/logo-facebook.jpg" alt=""></a>
    


        <a class="redes" href="instagram.html" target="tela"> <img src="Imagens/logo-instagram.jpg" alt=""></a>
    
        

        <a class="redes" href="twitter.html" target="tela"> <img src="Imagens/logo-twitter.jpg" alt=""></a>  
    
    </section>
    </main>
    
    


</body>
</html>
